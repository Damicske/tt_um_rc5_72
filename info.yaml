# Tiny Tapeout project information
project:
  title:        "RC5-72 iterative cracker core"
  author:       "Damic"
  discord:      ""
  description:  "Area-optimized, iterative RC5-72 batch-search core - tests one key at a time (~93 cycles/key) against a target ciphertext, over a 5-signal SPI slave interface."
  language:     "Verilog"
  clock_hz:     45000000
  
  # How many tiles your design occupies - a single tile is about 167x108uM.
  # Set to 8x2 (16 tiles) for now - the next fixed size up that
  # comfortably covers the ~13-tile back-of-envelope estimate from
  # generic yosys synthesis (see project history). Refine this down once
  # a real sky130-targeted synth/OpenLane area report exists - this is
  # NOT yet a real, technology-mapped tile count. Valid values: 1x1,
  # 1x2, 2x2, 3x2, 4x2, 6x2, 8x2 - "TODO" or any other placeholder text
  # will fail validation here, unlike the free-text fields above.
  tiles:        "8x2"
  
  top_module:   "tt_um_rc5_72"
  
  source_files:
    - "tt_um_rc5_72.v"
    - "rc5_batch_controller_spi.v"
    - "rc5_batch_controller.v"
    - "rc5_iterative_core.v"
    - "spi_slave.v"
    
  # The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "spi sclk"
  ui[1]: "spi mosi"
  ui[2]: "spi cs_n"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
    
    # Outputs
  uo[0]: "spi miso"
  uo[1]: "spi ready"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
    
    # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
    
  # Do not change!
yaml_version: 6
